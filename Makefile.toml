[env]
UI_MOCK_CONFIG = { value = "dev/portal-sim/example.toml", condition = { env_not_set = ["UI_MOCK_CONFIG"] } }

[tasks.ui-build]
description = "Build the offline Dioxus web assets."
workspace = false
command = "python3"
args = ["dev/portal/build.py"]

[tasks.release-web]
description = "Build production web assets using tools on PATH (or DX)."
workspace = false
command = "python3"
args = ["build-support/release.py", "web"]

[tasks.release-daemon]
description = "Build the production daemon; honors Cargo target/linker environment."
workspace = false
command = "python3"
args = ["build-support/release.py", "daemon"]

[tasks.release]
description = "Build production daemon and web assets; see docs/buildroot.md to install."
workspace = false
dependencies = ["release-web", "release-daemon"]

[tasks.ui]
description = "Run the local UI with TOML-configured fake Wi-Fi (no hardware)."
workspace = false
dependencies = ["ui-build"]
command = "cargo"
args = ["run", "--manifest-path", "dev/portal-sim/Cargo.toml", "--locked", "--offline", "--target-dir", ".target/portal-sim", "--", ".target/dx/wifi-setupd-ui/release/web/public", "${UI_MOCK_CONFIG}"]

[tasks.dev]
description = "Develop the UI with Dioxus hot reload and the TOML Wi-Fi simulator."
workspace = false
command = "python3"
args = ["dev/portal/serve.py", "${UI_MOCK_CONFIG}"]

[tasks.ssh]
description = "Open an interactive shell on the configured development Pi over Ethernet."
workspace = false
command = "python3"
args = ["dev/pi/pi.py", "ssh"]
