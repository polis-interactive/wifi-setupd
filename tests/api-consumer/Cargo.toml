[package]
name = "wifi-setupd-zbus-api-consumer-check"
version = "0.0.0"
edition = "2024"
publish = false

# Deliberately independent: no workspace dependency or feature unification.
[workspace]

[dependencies]
wifi-setupd-zbus-api = { path = "../../crates/wifi-setupd-zbus-api" }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
tokio = { version = "1.53.2", features = ["macros", "rt"] }
