name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install build tools
        run: bash build-support/setup-ci.sh

      - name: Restore Cargo dependencies and build output
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          cache-bin: "false"
          workspaces: |
            . -> .target
            dev/portal-sim -> ../../.target/portal-sim
            tests/api-consumer -> ../../.target/api-consumer

      - name: Install test tools
        run: bash build-support/setup-browser.sh

      - name: Build and test
        run: cargo make ci

      - name: Package tested portal
        if: github.event_name == 'push'
        run: cargo make package-web

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'push'
        with:
          name: release-portal-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/wifi-setupd-web-*
          if-no-files-found: error
          retention-days: 90
