name: Release portal

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-portal-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
      actions: read
    outputs:
      ci_run_id: ${{ steps.validate.outputs.ci_run_id }}
      ci_run_attempt: ${{ steps.validate.outputs.ci_run_attempt }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Validate tag and require successful main CI
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 build-support/validate-release.py --tag "$RELEASE_TAG" --commit "$GITHUB_SHA" --require-ci

  publish:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the tested portal from main CI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-portal-${{ github.sha }}-${{ needs.validate.outputs.ci_run_attempt }}
          run-id: ${{ needs.validate.outputs.ci_run_id }}
          github-token: ${{ github.token }}
          path: dist

      - name: Verify artifact provenance and checksums
        run: python3 build-support/validate-release.py --tag "$RELEASE_TAG" --commit "$GITHUB_SHA" --artifact-dir dist

      - name: Publish without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" dist/wifi-setupd-web-*
