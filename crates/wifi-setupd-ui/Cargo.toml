[package]
name = "wifi-setupd-ui"
description = "Web provisioning UI for wifi-setupd"
version.workspace = true
edition.workspace = true
publish.workspace = true
include = ["src/**", "assets/**", "Cargo.toml", "Dioxus.toml"]

[dependencies]
dioxus = { version = "0.7", default-features = false, features = ["web", "macro", "html", "signals", "hooks", "launch", "asset", "document"] }
gloo-net = { version = "0.6", features = ["http"] }
gloo-timers = { version = "0.3", features = ["futures"] }
wifi-setupd-http-api.workspace = true
serde.workspace = true
futures-util.workspace = true

[lints]
workspace = true
