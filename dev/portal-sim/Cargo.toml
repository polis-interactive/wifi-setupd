[package]
name = "wifi-setupd-portal-sim"
version = "0.1.0"
edition = "2024"
publish = false
[workspace]
[dependencies]
wifi-setupd = { path = "../../crates/wifi-setupd" }
wifi-setupd-zbus-api = { path = "../../crates/wifi-setupd-zbus-api" }
axum = "0.8.9"
tokio = { version = "1.53.2", features = ["macros", "rt", "time", "signal"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["test-util"] }
